<section class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      @if (successMessage) {
        <p class="success">{{ successMessage }}</p>
      }

      <form
        class="login-form"
        (ngSubmit)="login()"
        autocomplete="off"
      >
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          >
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input
            matInput
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="new-password"
          >
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit">
          Se connecter
        </button>
      </form>

      <div class="register-options">
        <h3>Vous n’avez pas encore de compte ?</h3>

        <a mat-button routerLink="/register" [queryParams]="{ role: 'Client' }">
          Créer un compte client
        </a>

        <a mat-button routerLink="/register" [queryParams]="{ role: 'Restaurateur' }">
          Créer un compte restaurateur
        </a>

        <a mat-button routerLink="/register" [queryParams]="{ role: 'Livreur' }">
          Créer un compte livreur
        </a>
      </div>
    </mat-card-content>
  </mat-card>
</section>
